version: "3.8"

services:
  db:
    image: postgres:16
    container_name: postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: todo_db
    ports:
      - "5439:5432"  # Внешний порт 5439 на ПК -> внутренний 5432 в Docker
    volumes:
      - pgdata_todo:/var/lib/postgresql/data
    restart: always

volumes:
  pgdata_todo:  # Уникальное имя тома, чтобы не зацепить старые кэшированные данные
